[package]
name = "stunclient"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "STUN client for testing"

[[bin]]
name = "stunclient"
path = "src/main.rs"

[lib]
name = "stunclient"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
chrono.workspace = true
thiserror.workspace = true
stun-protocol = { path = "../stun-protocol" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
chrono.workspace = true
