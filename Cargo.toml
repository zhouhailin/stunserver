[workspace]
members = [
    "crates/stun-protocol",
    "src/server",
    "src/client",
    "src/bench",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["STUN Server Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
chrono = "0.4"
byteorder = "1.5"
thiserror = "1.0"
flate2 = "1.1"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
subtle = "2.5"
crc32fast = "1.4"
stringprep = "0.1"
rand = "0.8"
