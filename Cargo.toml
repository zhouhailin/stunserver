[workspace]
members = [
    "stun-protocol",
    "stunserver",
    "stunclient",
    "stunbench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["STUN Server Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
chrono = "0.4"
byteorder = "1.5"
thiserror = "1.0"
