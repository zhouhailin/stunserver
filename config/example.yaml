# STUN Server - Production Configuration Example
#
# Copy this file to /etc/stunserver/config.yaml and adjust as needed.
# All fields are optional; defaults are shown in comments.

server:
  # Listen address and port.
  # Use "0.0.0.0:3478" for all IPv4 interfaces (standard STUN port).
  # Use "[::]:3478" for dual-stack IPv4/IPv6.
  listen: "0.0.0.0:3478"

logging:
  # Log level: error, warn, info, debug
  level: "info"

  # Output destination: console, file, both
  output: "file"

  # File logging configuration (required when output is "file" or "both").
  file:
    # Log file path (absolute or relative).
    path: "/var/log/stunserver/stunserver.log"

    # Maximum file size before rotation.
    # Supported units: B, KB, MB, GB (powers of 1024).
    max_size: "100MB"

    # Rotation strategy: daily (rotated at midnight local time).
    rotation: "daily"

    # Maximum number of rotated log files to retain.
    # Oldest files are deleted when this limit is exceeded.
    max_files: 7
