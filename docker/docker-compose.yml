# Docker Compose for STUN Server
# Usage: docker compose up -d

services:
  stunserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: stunserver:latest
    container_name: stunserver
    restart: unless-stopped
    # Host networking is the default to avoid Docker NAT for UDP/STUN.
    network_mode: host
    volumes:
      - ../config/stunserver.conf:/opt/stunserver/etc/stunserver.conf:ro
      - stunserver-logs:/opt/stunserver/log
    environment:
      - STUN_LOG_LEVEL=info

volumes:
  stunserver-logs:
    driver: local
