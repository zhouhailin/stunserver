# STUN server kernel tuning parameters.
# Installed to /etc/sysctl.d/99-stunserver.conf by deploy/Makefile.
#
# The server requests udp_recv_buffer_size/udp_send_buffer_size for its UDP
# socket, but the kernel silently caps them at rmem_max/wmem_max. The defaults
# (often 212992 bytes) are only a few milliseconds of buffering at tens of
# thousands of packets per second, so responses are dropped in bursts.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Queue between the NIC driver and the network stack. Raise it when bursts are
# dropped before they reach the socket; drops show up as the "dropped" column
# of /proc/net/softnet_stat.
net.core.netdev_max_backlog = 16384
